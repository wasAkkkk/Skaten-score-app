<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バトル結果</title>
    <style>
        :root {
            --theme-color: #00ffcc;
            --bg-gradient: linear-gradient(135deg, #1e1e2f, #2a2a40);
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-gradient);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            transition: background 0.5s ease;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid var(--theme-color);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--theme-color);
            width: 85%;
            max-width: 400px;
            transition: all 0.5s ease;
        }
        h1 {
            font-size: 0.85rem;
            color: #a0a0c0;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        .char-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--theme-color);
            margin-bottom: 10px;
        }
        /* キャラクター画像枠のスタイル */
        .char-image-container {
            margin: 10px 0;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .char-image {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px var(--theme-color));
        }
        .result-banner {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 5px 0;
            text-transform: uppercase;
        }
        .win {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.3);
        }
        .lose {
            color: #ff3344;
            text-shadow: 0 0 20px rgba(255, 51, 68, 0.6), 0 0 40px rgba(255, 51, 68, 0.3);
        }
        .stats-container {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-box {
            text-align: center;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #a0a0c0;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
        }
        .form-button {
            display: inline-block;
            background: var(--theme-color);
            color: #1e1e2f;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .form-button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card" id="cardBox">
        <h1 id="titleText">BATTLE RESULT</h1>
        <div class="char-name" id="charName">読み込み中...</div>
        
        <!-- キャラクター画像表示領域 -->
        <div class="char-image-container">
            <img id="charImg" class="char-image" src="" alt="キャラ画像" style="display: none;">
        </div>

        <!-- Win / Lose の大きく目立つ表示 -->
        <div class="result-banner" id="resultBanner">--</div>

        <!-- スコア・ダメージの内訳表示 -->
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-label">SCORE</div>
                <div class="stat-value" id="scoreValue">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">DAMAGE</div>
                <div class="stat-value" id="damageValue">--</div>
            </div>
        </div>
        
        <!-- Googleフォームへのリンクボタン -->
        <a id="formLink" href="https://docs.google.com/forms/d/1tBUoU5IAxAHcVR__tkuz1O63Bt6C98Ol8I9bn_ejSPo/viewform" target="_blank" class="form-button">
            📝 結果をフォームに送信
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const char = urlParams.get('char'); 
        const score = urlParams.get('score');
        const result = urlParams.get('result'); 
        const damage = urlParams.get('damage'); 
        
        const charElement = document.getElementById('charName');
        const charImgElement = document.getElementById('charImg');
        const scoreElement = document.getElementById('scoreValue');
        const damageElement = document.getElementById('damageValue');
        const resultBanner = document.getElementById('resultBanner');

        // キャラクターごとの設定データ（名前、カラー、背景、画像ファイル名）
        const characterData = {
             'E': { name: 'E Electrical', color: '#ffcc00', bg: 'linear-gradient(135deg, #2b2611, #40381a)', img: 'katenE.tiff' },
            'I':   { name: 'I Information',   color: '#00ccff', bg: 'linear-gradient(135deg, #11222b, #1a3440)', img: 'katenI.tiffg' },
            'C': { name: 'C Chemical', color: '#cc00ff', bg: 'linear-gradient(135deg, #26112b, #381a40)', img: 'katenC.tiff' },
            'M':    { name: 'M Mechanical',   color: '#ff3333', bg: 'linear-gradient(135deg, #2b1111, #401a1a)', img: 'katenM.tiff' },
            'S':  { name: 'S Control', color: '#33ff33', bg: 'linear-gradient(135deg, #112b11, #1a401a)', img: 'katenS.tiff' }
        };

        if (char && characterData[char]) {
            const currentData = characterData[char];
            document.documentElement.style.setProperty('--theme-color', currentData.color);
            document.documentElement.style.setProperty('--bg-gradient', currentData.bg);
            charElement.textContent = currentData.name;
            
            // 画像の設定
            if (currentData.img) {
                charImgElement.src = currentData.img;
                charImgElement.style.display = 'block';
            }
        } else {
            charElement.textContent = "ファイター";
        }

        // 勝敗表示の判定
        if (result) {
            const lowerResult = result.toLowerCase();
            if (lowerResult === 'win') {
                resultBanner.textContent = "VICTORY";
                resultBanner.className = "result-banner win";
            } else if (lowerResult === 'lose') {
                resultBanner.textContent = "DEFEAT";
                resultBanner.className = "result-banner lose";
            } else {
                resultBanner.textContent = result.toUpperCase();
            }
        } else {
            resultBanner.textContent = "RESULT";
        }

        // スコアとダメージの設定
        scoreElement.textContent = score !== null ? score : "-";
        damageElement.textContent = damage !== null ? damage : "-";
    </script>
</body>
</html>
