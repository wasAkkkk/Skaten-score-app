<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラ別スコア結果</title>
    <style>
        :root {
            --theme-color: #00ffcc;
            --bg-gradient: linear-gradient(135deg, #1e1e2f, #2a2a40);
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-gradient);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.5s ease;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid var(--theme-color);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--theme-color);
            width: 85%;
            max-width: 400px;
            transition: all 0.5s ease;
        }
        h1 {
            font-size: 0.9rem;
            color: #a0a0c0;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .char-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--theme-color);
            margin-bottom: 15px;
        }
        .score-container {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--theme-color);
            text-shadow: 0 0 15px var(--theme-color);
            margin: 10px 0;
        }
        .message {
            font-size: 0.85rem;
            color: #d0d0e0;
            margin-bottom: 20px;
        }
        .form-button {
            display: inline-block;
            background: var(--theme-color);
            color: #1e1e2f;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .form-button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card" id="cardBox">
        <h1 id="titleText">TOTAL SCORE</h1>
        <div class="char-name" id="charName">読み込み中...</div>
        <div class="score-container" id="scoreValue">--</div>
        <div class="message" id="messageText">NFCタグを読み込みました</div>
        
        <!-- Googleフォームへのリンクボタン -->
        <a id="formLink" href="https://docs.google.com/forms/d/e/1FAIpQLScUW6lqtMgDWpG8Ny-9kZUI3xASsP9b4IO1pmZGd69bxX3Grw/viewform?usp=publish-editor" target="_blank" class="form-button">
            📝 アンケート募集中です！
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const char = urlParams.get('char'); 
        const score = urlParams.get('score');
        
        const charElement = document.getElementById('charName');
        const scoreElement = document.getElementById('scoreValue');
        const messageElement = document.getElementById('messageText');
        const formLink = document.getElementById('formLink');

        // キャラクターごとの設定データ（カラーや背景）
        const characterData = {
            'E': { name: 'E Electrical', color: '#ffcc00', bg: 'linear-gradient(135deg, #2b2611, #40381a)' },
            'I':   { name: 'I Information',   color: '#00ccff', bg: 'linear-gradient(135deg, #11222b, #1a3440)' },
            'C': { name: 'C Chemical', color: '#cc00ff', bg: 'linear-gradient(135deg, #26112b, #381a40)' },
            'M':    { name: 'M Mechanical',   color: '#ff3333', bg: 'linear-gradient(135deg, #2b1111, #401a1a)' },
            'S':  { name: 'S Control', color: '#33ff33', bg: 'linear-gradient(135deg, #112b11, #1a401a)' }
        };

        if (char && characterData[char]) {
            const currentData = characterData[char];
            document.documentElement.style.setProperty('--theme-color', currentData.color);
            document.documentElement.style.setProperty('--bg-gradient', currentData.bg);
            charElement.textContent = currentData.name;
        } else {
            charElement.textContent = "スタンダード";
        }

        if (score !== null) {
            scoreElement.textContent = score;
            const numScore = Number(score);
            if (numScore >= 90) {
                messageElement.textContent = "🔥Fantastic!";
            } else {
                messageElement.textContent = "👍 Nice！";
            }

            // （応用）もしGoogleフォーム側にスコアやキャラクター情報を自動で引き渡したい場合は、
            // フォーム側のエントリーIDを使ってURLを組み立てることも可能です！
        } else {
            scoreElement.textContent = "ERR";
            messageElement.textContent = "スコアが指定されていません";
        }
    </script>
</body>
</html>
