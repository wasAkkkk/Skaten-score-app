<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラ別スコア結果</title>
    <style>
        :root {
            --theme-color: #00ffcc;
            --bg-gradient: linear-gradient(135deg, #1e1e2f, #2a2a40);
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-gradient);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.5s ease;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid var(--theme-color);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--theme-color);
            width: 80%;
            max-width: 400px;
            transition: all 0.5s ease;
        }
        h1 {
            font-size: 1rem;
            color: #a0a0c0;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .char-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--theme-color);
            margin-bottom: 20px;
        }
        .score-container {
            font-size: 4rem;
            font-weight: bold;
            color: var(--theme-color);
            text-shadow: 0 0 15px var(--theme-color);
            margin: 10px 0;
        }
        .message {
            font-size: 0.9rem;
            color: #d0d0e0;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card" id="cardBox">
        <h1 id="titleText">SKATE SCORE</h1>
        <div class="char-name" id="charName">読み込み中...</div>
        <div class="score-container" id="scoreValue">--</div>
        <div class="message" id="messageText">NFCタグを読み込みました</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const char = urlParams.get('char'); // キャラクター識別用 (yellow, blue, purple, red, green)
        const score = urlParams.get('score');
        
        const charElement = document.getElementById('charName');
        const scoreElement = document.getElementById('scoreValue');
        const messageElement = document.getElementById('messageText');
        const cardBox = document.getElementById('cardBox');

        // キャラクターごとの設定データ
        const characterData = {
            'yellow': { name: 'E', color: '#ffcc00', bg: 'linear-gradient(135deg, #2b2611, #40381a)' },
            'blue':   { name: 'I',   color: '#00ccff', bg: 'linear-gradient(135deg, #11222b, #1a3440)' },
            'purple': { name: 'C', color: '#cc00ff', bg: 'linear-gradient(135deg, #26112b, #381a40)' },
            'red':    { name: 'M',   color: '#ff3333', bg: 'linear-gradient(135deg, #2b1111, #401a1a)' },
            'green':  { name: 'S', color: '#33ff33', bg: 'linear-gradient(135deg, #112b11, #1a401a)' }
        };

        if (char && characterData[char]) {
            const currentData = characterData[char];
            // 画面の色やテーマをキャラに合わせて変更
            document.documentElement.style.setProperty('--theme-color', currentData.color);
            document.documentElement.style.setProperty('--bg-gradient', currentData.bg);
            charElement.textContent = currentData.name;
        } else {
            charElement.textContent = "スタンダード";
        }

        if (score !== null) {
            scoreElement.textContent = score;
            const numScore = Number(score);
            if (numScore >= 90) {
                messageElement.textContent = "🔥大成功！";
            } else {
                messageElement.textContent = "👍 次回もこの調子で行こう！";
            }
        } else {
            scoreElement.textContent = "ERR";
            messageElement.textContent = "記録スコアが見つかりません！";
        }
    </script>
</body>
</html>
